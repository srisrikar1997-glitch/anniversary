<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary, Ramani!</title>
    <style>
        /* --- General Styles --- */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: #fdfaf6;
            color: #4a4a4a;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Envelope & Seal Screen --- */
        #envelope-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #fdfaf6;
            z-index: 10;
            transition: opacity 1.5s ease;
        }

        .instruction {
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #d6336c;
            font-style: italic;
            animation: pulse 2s infinite;
        }

        .seal {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #b31217, #e52d27);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: gold;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.5);
            cursor: pointer;
            border: 3px solid #8a0c10;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .seal:active {
            transform: scale(0.9);
        }

        /* --- Letter Screen --- */
        #letter-screen {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
            transition: opacity 1.5s ease;
        }

        .letter-content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border: 1px solid #f0e6d2;
        }

        h1 {
            color: #d6336c;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.8;
            font-size: 1.1rem;
        }

        /* --- Gallery Section --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .gallery-item {
            width: 100%;
            height: 250px;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.05);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: The Seal -->
    <div id="envelope-screen">
        <p class="instruction">💋 Kiss (tap) the seal to open</p>
        <div class="seal" id="seal" onclick="openLetter()">
            S ❤️ R
        </div>
    </div>

    <!-- SCREEN 2: The Letter & Gallery -->
    <div id="letter-screen">
        <div class="letter-content">
            <h1>Happy Anniversary, Ramani ❤️</h1>
            <p>My dearest Cherry,</p>
            <p>Write your beautiful anniversary message here. You can make this as long or as short as you want. When she scrolls down, she will see all the memories you've put together.</p>
            <p>Forever yours,<br>Srikar</p>
        </div>

        <h2 style="color: #d6336c; margin-bottom: 20px;">Our Memories</h2>
        
        <!-- Gallery Grid -->
        <div class="gallery-container">
            <!-- Replace 'images/photo1.jpg' with your actual file names once inside your folder -->
            <div class="gallery-item">
                <img src="images/photo1.jpg" alt="Memory 1" onerror="this.src='https://via.placeholder.com/300x400/ffe6ea/d6336c?text=Photo+1'">
            </div>
            <div class="gallery-item">
                <img src="images/photo2.jpg" alt="Memory 2" onerror="this.src='https://via.placeholder.com/300x400/ffe6ea/d6336c?text=Photo+2'">
            </div>
            <div class="gallery-item">
                <img src="images/photo3.jpg" alt="Memory 3" onerror="this.src='https://via.placeholder.com/300x400/ffe6ea/d6336c?text=Photo+3'">
            </div>
            <div class="gallery-item">
                <img src="images/photo4.jpg" alt="Memory 4" onerror="this.src='https://via.placeholder.com/300x400/ffe6ea/d6336c?text=Photo+4'">
            </div>
        </div>
    </div>

    <!-- JavaScript for the opening animation -->
    <script>
        function openLetter() {
            const envelopeScreen = document.getElementById('envelope-screen');
            const letterScreen = document.getElementById('letter-screen');

            // Fade out the seal screen
            envelopeScreen.style.opacity = '0';
            
            // Wait for fade out, then hide it and show the letter
            setTimeout(() => {
                envelopeScreen.style.display = 'none';
                letterScreen.style.display = 'flex';
                
                // Trigger reflow to ensure the fade-in works
                void letterScreen.offsetWidth; 
                
                // Fade in the letter and gallery
                letterScreen.style.opacity = '1';
                window.scrollTo(0, 0); // Ensure they start at the top of the letter
            }, 1000); // 1 second delay matches the CSS transition
        }
    </script>
</body>
</html>
